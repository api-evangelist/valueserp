gaps:
  - No API versioning of any kind — consumers cannot pin behaviour.
  - No published deprecation policy or minimum notice period.
  - Deprecation dates are published without a year.
  - No RFC 8594 Sunset/Deprecation response headers on deprecated request types.
  - No published numeric SLA outside Enterprise agreements.
