description: >-
  How ValueSERP versions, deprecates, and reports on its API. The short version:
  it does not version at all. There is no version segment in the base URL or
  path, no version request header, and no dated release train — changes land for
  every caller at once and are announced in prose on the Product Updates page.
  Deprecations ARE announced with a named calendar date and a named replacement,
  which is better than most unversioned APIs manage, but they are announced only
  in the docs sidebar and page titles, never in a response header.

versioning:
  scheme: none
  in_path: false
  in_header: false
  in_query: false
  base_url: https://api.valueserp.com
  notes: >-
    Every documented endpoint is unversioned (GET /search, /account, /locations,
    /batches, /destinations, /errorlogs). Consumers cannot pin behaviour. New
    response fields are added in place — the changelog is explicit that fields
    such as knowledge_graph_id, conversion_table and shopping_graphs "are now
    included" in existing responses — so clients must be tolerant readers.

deprecation:
  policy_url: null
  policy_published: false
  changelog: https://docs.trajectdata.com/valueserp/product-updates
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  mechanism: >-
    Deprecations are communicated by renaming the documentation page (the title
    itself becomes "Google Product deprecating on 10/31") and by publishing a
    replacement page. There is no Sunset or Deprecation response header, no
    machine-readable notice, and no standing deprecation policy document that
    states a minimum notice period.
  notes: >-
    The dated deprecations below are labelled "10/31" in the documentation
    without a year. They accompany the "*New*" replacement request types and the
    October 2025 changelog cycle, so 10/31 most plausibly means 2025-10-31 — but
    the provider does not state the year, and that ambiguity is itself the
    finding. Do not treat the resolved year as published fact.

