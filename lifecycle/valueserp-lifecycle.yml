incident_semantics:
  parsing_incidents: >-
    When a request type cannot be parsed reliably, ValueSERP returns HTTP 503
    for that type rather than serving partial data, with a body naming the
    affected type and a retry_after value. Callers opt in with
    skip_on_incident. Requests that fail this way are not charged.
  docs: https://docs.trajectdata.com/valueserp/response-codes

