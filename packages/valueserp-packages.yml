description: >-
  ValueSERP / Traject Data publish NO first-party client libraries. The
  documentation teaches the API through copy-paste request examples only
  (HTTP, curl, Node.js/axios, Python/requests, PHP/curl) on every reference
  page, and there is no Traject Data or ValueSERP organization on GitHub, npm,
  PyPI, Packagist, RubyGems or crates.io. Everything listed below is
  community-maintained by unaffiliated third parties; official is false on
  every entry. No `SDKs` pointer is emitted in apis.yml because the provider
  ships no SDK.
